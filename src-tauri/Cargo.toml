[package]
name = "rundown"
version = "0.1.0"
description = "An AI-native Hacker News client"
authors = ["Kamran Ahmed"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rundown_lib"
# staticlib/cdylib are only needed for mobile targets; this app is macOS only,
# and the static archive alone costs about a gigabyte to link.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["full"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
anyhow = "1.0.104"
chrono = "0.4.45"
futures = "0.3.34"
once_cell = "1.21.4"
scraper = "0.27.0"
dom_smoothie = "0.18.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "brotli", "rustls-tls"] }
html2md = "0.2"
urlencoding = "2"
dirs = "6"
ego-tree = "0.11.0"
tauri-plugin-window-state = "2.4.1"
htmd = "0.5.5"
dom_query = "0.28.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

